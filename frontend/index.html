<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b5c4a" />
    <title>AcademicAI — your academic life, organised</title>
    <meta name="description" content="AcademicAI turns scattered academic announcements into dated events, reminders and answers, organised by your department, level and academic session." />
    <!-- The departure board in miniature: a ruled list on the accent ground.
         Inline so it costs no request and cannot 404. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b5c4a'/%3E%3Cg stroke='%23f6f7f4' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 11h16M8 16h11M8 21h7'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- No webfonts. The type stack in styles.css is the reader's own system
         font, so there is nothing to download, nothing to block first paint,
         and no flash of the wrong face on a slow connection. -->
  </head>
  <body>
    <!-- Stamp the saved theme BEFORE first paint. Without this, someone who
         chose dark gets one frame of the light palette on every page load,
         which is the most visible flaw a themed site can have. Kept inline and
         tiny on purpose; it must run before the bundle. -->
    <script>
      try {
        var t = localStorage.getItem('academicai:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* blocked site data: fall through to the system palette */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
