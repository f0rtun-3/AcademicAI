[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    concurrency: exercises transactional/concurrent behaviour
    worker: exercises the background worker
    security: exercises an authorization or isolation rule
    postgres: exercises the PostgreSQL backend (needs ACADEMICAI_TEST_POSTGRES_URL)
    sqlite_only: tests SQLite itself; skipped when the suite runs on PostgreSQL
